    <!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Chatbot</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
  </head>
  <body>
    	
	<div id="chat-icon">
        <p class="help">Need help?</p>
        <img class="chat-img" src="vglLogo.png" alt="Chat Icon"/>
    </div>


    <div id="chatbox">
		<div id="support">
			<header>
				<div>VGL Support</div>
				<div id="exit">X</div>
			</header>
		</div>

        <div class="message" id="greeting"></div>
        <div class="options" id="options"></div>

    </div>
  </body>
</html>
